name: release

# 推送 v* 标签时：构建 NSIS 安装包 + 便携版 zip，自动创建 GitHub Release 并上传产物。
# 前置条件（一次性）：
#   1) 仓库 Settings → Actions → General → Workflow permissions 选 "Read and write permissions"
#   2)（可选，更新用）生成签名密钥对：
#      npx @tauri-apps/cli signer generate -w ~/.tauri/puredesk.key
#      把私钥存到仓库 Secret TAURI_SIGNING_PRIVATE_KEY，公钥填入 tauri.conf.json bundle.updater.pubkey

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Type check + build frontend
        run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Build app + NSIS installer
        # tauri build = beforeBuildCommand(npm run build) + cargo release + NSIS 打包
        env:
          # 更新签名私钥（可选）：不配置则跳过 updater 签名，不影响安装包构建
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Make portable zip + checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/puredesk.exe dist/
          Compress-Archive -Path dist/puredesk.exe -DestinationPath PureDesk_${{ github.ref_name }}_x64_portable.zip -Force
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, PureDesk_${{ github.ref_name }}_x64_portable.zip
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)" | Out-File -Append SHA256SUMS.txt -Encoding ascii
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            PureDesk_${{ github.ref_name }}_x64_portable.zip
            SHA256SUMS.txt
